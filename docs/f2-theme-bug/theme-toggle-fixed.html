<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>主题切换练习（已修复）</title>
  <style>
    body { background: white; color: black; transition: background 0.3s, color 0.3s; }
    body.dark { background: #202020; color: white; }
    button { padding: 10px 22px; border-radius: 8px; border: 1px solid #ccc; cursor: pointer; }
  </style>
</head>
<body>
  <button id="theme-toggle" type="button">切换主题</button>
  <script>
    // 修复：原代码用 document.querySelector("#theme")，选择器与按钮 id 不匹配，
    // 返回 null，调用 addEventListener 抛出 TypeError。此处改为正确的 id。
    var button = document.querySelector("#theme-toggle");
    button.addEventListener("click", function () {
      document.body.classList.toggle("dark");
    });
  </script>
</body>
</html>
