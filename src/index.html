<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Voyarina 的个人网站">
  <title>Voyarina · 个人网站</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("voyarina-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="nav">
    <nav class="nav-inner" aria-label="主导航">
      <a class="brand" href="#top"><img class="brand-avatar" src="https://avatars.githubusercontent.com/u/87115797?v=4" alt="">Voyarina</a>
      <div class="nav-links" id="nav-links">
        <a href="#about">简介</a>
        <a href="#projects">项目</a>
        <a href="#showcase">展示</a>
        <a href="#skills">技能</a>
        <a href="#contact">联系</a>
      </div>
      <div class="nav-actions">
        <button id="theme-toggle" type="button" aria-label="切换浅色或深色主题">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="4.6"/><line x1="12" y1="19.4" x2="12" y2="22"/><line x1="2" y1="12" x2="4.6" y2="12"/><line x1="19.4" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="6.7" y2="6.7"/><line x1="17.3" y1="17.3" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="6.7" y2="17.3"/><line x1="17.3" y1="6.7" x2="19.1" y2="4.9"/></g></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20.6 14.2A8.6 8.6 0 0 1 9.8 3.4a8.6 8.6 0 1 0 10.8 10.8Z" fill="currentColor"/></svg>
        </button>
        <button id="menu-toggle" type="button" class="menu-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="打开菜单">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></g></svg>
        </button>
      </div>
    </nav>
  </header>

  <main id="main">
    <section id="about" class="hero">
      <img src="https://avatars.githubusercontent.com/u/87115797?v=4" alt="Voyarina 的 GitHub 头像" class="avatar" width="96" height="96">
      <p class="eyebrow">郑州大学 ZZU <span class="name-nowrap">(本主页用于深蓝电控组二轮考核评估)</span></p>
      <h1>你好，我是 <span class="name-nowrap">陈鑫运。</span></h1>
      <p class="handle">@Voyarina</p>
      <p class="lede">喜欢把想法做成能用的东西：从 12306 的可视化工具，到 AI 驱动的教学系统。</p>
       <p class="lede">目前正在学习LLM基础、嵌入式与前端开发。</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="https://github.com/Voya-rina" target="_blank" rel="noopener">GitHub 主页</a>
        <a class="btn btn-ghost" href="#projects">看看项目</a>
      </div>
    </section>

    <section id="projects" class="section">
      <h2>项目</h2>
      <div class="filter-bar" id="filter-bar" role="group" aria-label="按分类筛选项目"></div>
      <p class="project-count" id="project-count" aria-live="polite"></p>
      <div class="project-grid" id="project-grid"></div>
    </section>

    <section id="showcase" class="section">
      <h2>展示</h2>
      <aside class="show-card" aria-live="polite">
        <div class="show-card-inner" id="show-card-inner">
          <div class="project-head">
            <h3 id="show-name"></h3>
            <span class="project-tag" id="show-tag"></span>
          </div>
          <p class="show-desc" id="show-desc"></p>
          <a class="project-link" id="show-link" target="_blank" rel="noopener">查看仓库 →</a>
        </div>
      </aside>
      <div class="showcase-list" id="showcase-list">
        <figure class="shot wide" data-project="ticket-request" data-category="工具">
          <img class="img-light" src="../assets/ticket-request-light.png" alt="ticket-request 浅色主题界面" loading="lazy">
          <img class="img-dark" src="../assets/ticket-request-dark.png" alt="ticket-request 深色主题界面" loading="lazy">
        </figure>
        <figure class="shot wide" data-project="QuestEdu" data-category="教育">
          <img class="img-light" src="../assets/questedu-light.png" alt="QuestEdu 教师控制台浅色界面" loading="lazy">
          <img class="img-dark" src="../assets/questedu-dark.png" alt="QuestEdu 教师控制台深色界面" loading="lazy">
        </figure>
        <figure class="shot strip strip-4" data-project="CaliEdu" data-category="教育">
          <img class="img-light" src="../assets/caliedu-light-1.jpg" alt="CaliEdu 课程学习页（浅色）" loading="lazy">
          <img class="img-light" src="../assets/caliedu-light-2.jpg" alt="CaliEdu 首页（浅色）" loading="lazy">
          <img class="img-light" src="../assets/caliedu-light-3.jpg" alt="CaliEdu 资料列表（浅色）" loading="lazy">
          <img class="img-light" src="../assets/caliedu-light-4.jpg" alt="CaliEdu 学习记录（浅色）" loading="lazy">
          <img class="img-dark" src="../assets/caliedu-dark-1.jpg" alt="CaliEdu 课程学习页（深色）" loading="lazy">
          <img class="img-dark" src="../assets/caliedu-dark-2.jpg" alt="CaliEdu 首页（深色）" loading="lazy">
          <img class="img-dark" src="../assets/caliedu-dark-3.jpg" alt="CaliEdu 资料列表（深色）" loading="lazy">
          <img class="img-dark" src="../assets/caliedu-dark-4.jpg" alt="CaliEdu 学习记录（深色）" loading="lazy">
        </figure>
        <figure class="shot strip strip-4" data-project="ZZUPocket" data-category="校园">
          <img class="img-light" src="../assets/zzupocket-light-1.jpg" alt="ZZUPocket 首页（浅色）" loading="lazy">
          <img class="img-light" src="../assets/zzupocket-light-2.jpg" alt="ZZUPocket 课程表（浅色）" loading="lazy">
          <img class="img-light" src="../assets/zzupocket-light-3.jpg" alt="ZZUPocket 电费统计（浅色）" loading="lazy">
          <img class="img-light" src="../assets/zzupocket-light-4.jpg" alt="ZZUPocket 教室占用（浅色）" loading="lazy">
          <img class="img-dark" src="../assets/zzupocket-dark-1.jpg" alt="ZZUPocket 首页（深色）" loading="lazy">
          <img class="img-dark" src="../assets/zzupocket-dark-2.jpg" alt="ZZUPocket 课程表（深色）" loading="lazy">
          <img class="img-dark" src="../assets/zzupocket-dark-3.jpg" alt="ZZUPocket 电费统计（深色）" loading="lazy">
          <img class="img-dark" src="../assets/zzupocket-dark-4.jpg" alt="ZZUPocket 教室占用（深色）" loading="lazy">
        </figure>
      </div>
    </section>

    <section id="skills" class="section">
      <h2>技能</h2>
      <div class="skill-groups" id="skill-groups"></div>
    </section>

    <section id="contact" class="section">
      <h2>联系</h2>
      <p class="contact-text">欢迎在 GitHub 上与我交流、提出 Issue、给我 Star。</p>
      <a class="btn btn-primary" href="https://github.com/Voya-rina" target="_blank" rel="noopener">Github 主页</a>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> Voyarina</p>
  </footer>

  <script src="data/projects.js"></script>
  <script src="app.js"></script>
</body>
</html>
