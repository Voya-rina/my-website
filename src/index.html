<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Voyarina 的个人网站：简介、技能与项目展示。">
  <title>Voyarina · 个人网站</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("voyarina-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="nav">
    <nav class="nav-inner" aria-label="主导航">
      <a class="brand" href="#top">Voyarina</a>
      <div class="nav-links" id="nav-links">
        <a href="#about">简介</a>
        <a href="#skills">技能</a>
        <a href="#projects">项目</a>
        <a href="#contact">联系</a>
      </div>
      <div class="nav-actions">
        <button id="theme-toggle" type="button" aria-label="切换浅色或深色主题">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="4.6"/><line x1="12" y1="19.4" x2="12" y2="22"/><line x1="2" y1="12" x2="4.6" y2="12"/><line x1="19.4" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="6.7" y2="6.7"/><line x1="17.3" y1="17.3" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="6.7" y2="17.3"/><line x1="17.3" y1="6.7" x2="19.1" y2="4.9"/></g></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20.6 14.2A8.6 8.6 0 0 1 9.8 3.4a8.6 8.6 0 1 0 10.8 10.8Z" fill="currentColor"/></svg>
        </button>
        <button id="menu-toggle" type="button" class="menu-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="打开菜单">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></g></svg>
        </button>
      </div>
    </nav>
  </header>

  <main id="main">
    <section id="about" class="hero">
      <img src="../assets/avatar.svg" alt="Voyarina 的头像" class="avatar" width="96" height="96">
      <p class="eyebrow">郑州大学 · 深蓝电控组</p>
      <h1>你好，我是 Voyarina。</h1>
      <p class="lede">喜欢把想法做成能用的东西：从 12306 的时刻轴工具，到 AI 驱动的教学系统。目前在电控组学习嵌入式与前端开发。</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="https://github.com/Voya-rina" target="_blank" rel="noopener">GitHub 主页</a>
        <a class="btn btn-ghost" href="#projects">看看项目</a>
      </div>
    </section>

    <section id="skills" class="section">
      <h2>技能</h2>
      <div class="skill-groups" id="skill-groups"></div>
    </section>

    <section id="projects" class="section">
      <h2>项目</h2>
      <div class="filter-bar" id="filter-bar" role="group" aria-label="按分类筛选项目"></div>
      <p class="project-count" id="project-count" aria-live="polite"></p>
      <div class="project-grid" id="project-grid"></div>
    </section>

    <section id="contact" class="section">
      <h2>联系</h2>
      <p class="contact-text">欢迎在 GitHub 上与我交流，Issue 和 Star 都是很好的开始。</p>
      <a class="btn btn-primary" href="https://github.com/Voya-rina" target="_blank" rel="noopener">github.com/Voya-rina</a>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> Voyarina · 用原生 HTML / CSS / JavaScript 构建</p>
  </footer>

  <script src="data/projects.js"></script>
  <script src="app.js"></script>
</body>
</html>
